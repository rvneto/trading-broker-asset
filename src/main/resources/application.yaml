spring:
  application:
    name: broker-asset-api

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3309}/broker_asset_db?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: ${DB_USER:broker_user}
    password: ${DB_PASSWORD:broker_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:9092
    consumer:
      group-id: broker-asset-api
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.rvneto.broker.asset.dto"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.rvneto.broker.asset.dto.AssetMarketDataDTO

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /api-docs